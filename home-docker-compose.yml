    volumes:
      - /opt/configs/go-ramjet/settings.yml:/etc/go-ramjet/settings.yml:ro
    command: -t heartbeat,ssl-monitor,rss,keyword,gptchat -c /etc/go-ramjet/settings.yml --debug

  ramjet:
    image: ppcelery/ramjet:latest
