# Sole-active HOME deployment; legacy roles are offline rollback profiles.
# Source inclusion does not adopt containers. See docs/observability-repository-boundary.md.
x-home-common: &home-common
  restart: unless-stopped
  security_opt:
  - no-new-privileges:true
  cap_drop:
  - ALL
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'
  user: 1000:1000

services:
  observability-gateway:
    <<: *home-common
    image: otel/opentelemetry-collector-contrib@sha256:fd328de2552466ad78385e1b1289c3f2402b1c45f265b252aab1955b42845ac1
    read_only: true
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 256
    environment:
      HOME_TOKEN: ${HOME_TOKEN:?Set HOME_TOKEN}
      GOMEMLIMIT: 512MiB
    command:
    - --config=/etc/otelcol/config.yaml
    ports:
    - 100.69.166.78:14318:4318
    - 100.69.166.78:18888:8888
    volumes:
    - type: bind
      source: /home/laisky/observability-delivery/task20261017-07/source/observability/gateway.yaml
      target: /etc/otelcol/config.yaml
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /opt/configs/observability/secrets
      target: /run/observability
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /home/laisky/observability-state/task20261017-07-active/home/collector
      target: /var/lib/otelcol
      read_only: false
      bind:
        create_host_path: false
    tmpfs:
    - /tmp:size=16m,mode=1777
    stop_grace_period: 45s
    networks:
      observability-home:
        aliases:
        - gateway
        - observability-qualification-gateway-1

  observability-victoria-metrics:
    <<: *home-common
    image: victoriametrics/victoria-metrics@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd
    mem_limit: 1g
    cpus: 2.0
    command:
    - -storageDataPath=/storage
    - -retentionPeriod=7d
    - -opentelemetry.usePrometheusNaming=true
    - -memory.allowedPercent=60
    - -promscrape.config=/etc/promscrape.yaml
    ports:
    - 100.69.166.78:18428:8428
    - 100.69.166.78:8428:8428
    volumes:
    - type: bind
      source: /home/laisky/observability-state/task20261017-07-active/home/metrics
      target: /storage
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /home/laisky/observability-delivery/task20261017-07/source/observability/promscrape.yaml
      target: /etc/promscrape.yaml
      read_only: true
      bind:
        create_host_path: false
    stop_grace_period: 60s
    networks:
      observability-home:
        aliases:
        - victoria-metrics
        - observability-qualification-victoria-metrics-1

  observability-victoria-logs:
    <<: *home-common
    image: victoriametrics/victoria-logs@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e
    mem_limit: 1g
    cpus: 2.0
    command:
    - -storageDataPath=/storage
    - -retentionPeriod=7d
    - -memory.allowedPercent=60
    ports:
    - 100.69.166.78:19428:9428
    - 100.69.166.78:9428:9428
    volumes:
    - type: bind
      source: /home/laisky/observability-state/task20261017-07-active/home/logs
      target: /storage
      read_only: false
      bind:
        create_host_path: false
    stop_grace_period: 60s
    networks:
      observability-home:
        aliases:
        - victoria-logs
        - observability-qualification-victoria-logs-1

  observability-victoria-traces:
    <<: *home-common
    image: victoriametrics/victoria-traces@sha256:80919fcc85cc6dd87f598d20ccf42d0ab1120de8f25d4dcf08c5ea2515a496ba
    mem_limit: 1g
    cpus: 2.0
    command:
    - -storageDataPath=/storage
    - -retentionPeriod=7d
    - -memory.allowedPercent=60
    ports:
    - 100.69.166.78:20428:10428
    - 100.69.166.78:10428:10428
    volumes:
    - type: bind
      source: /home/laisky/observability-state/task20261017-07-active/home/traces
      target: /storage
      read_only: false
      bind:
        create_host_path: false
    stop_grace_period: 60s
    networks:
      observability-home:
        aliases:
        - victoria-traces
        - observability-qualification-victoria-traces-1

  observability-grafana:
    <<: *home-common
    image: grafana/grafana@sha256:3ea272e5cab64a4a62240c682e2c62433b25614d956d44c299a10cb6994f6f2e
    mem_limit: 512m
    cpus: 1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.27.1
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports:
    - 100.69.166.78:23000:3000
    volumes:
    - type: bind
      source: /home/laisky/observability-state/task20261017-07-active/home/grafana
      target: /var/lib/grafana
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: /home/laisky/observability-delivery/task20261017-07/source/observability/grafana/provisioning
      target: /etc/grafana/provisioning
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: /home/laisky/observability-delivery/task20261017-07/source/observability/grafana/dashboards
      target: /var/lib/grafana/dashboards
      read_only: true
      bind:
        create_host_path: false
    stop_grace_period: 30s
    networks:
      observability-home:
        aliases:
        - grafana
        - observability-qualification-grafana-1

networks:
  observability-home:
    external: true
    name: observability-qualification_default
