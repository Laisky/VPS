# Run from this directory. This is a shadow stack: existing VPS services and
# their data directories are never replaced implicitly. See README.md.
name: observability

x-common: &common
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

services:
  edge:
    <<: *common
    profiles: [edge]
    image: ${GO_FLUENTD_IMAGE:?Build the reviewed go-fluentd commit and set GO_FLUENTD_IMAGE}
    user: '${OBS_UID:-1000}:${OBS_GID:-1000}'
    read_only: true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    environment:
      GO_FLUENTD_OTLP_TOKEN: ${EDGE_TOKEN:?Set EDGE_TOKEN}
      GO_FLUENTD_HOME_TOKEN: ${HOME_TOKEN:?Set HOME_TOKEN}
      GOMEMLIMIT: 384MiB
    command: ['--config=/etc/edge.json', '--env=prd', '--addr=0.0.0.0:8080', '--log-level=info']
    ports:
      - '${EDGE_BIND:-127.0.0.1}:14319:4318'
      - '127.0.0.1:18088:8080'
    volumes:
      - ./generated/edge.json:/etc/edge.json:ro
      - ./secrets:/run/observability:ro
      - ${EDGE_STATE:-./state/edge}:/state
    tmpfs: ['/tmp:size=16m,mode=1777']
    stop_grace_period: 45s

  gateway:
    <<: *common
    profiles: [home]
    image: otel/opentelemetry-collector-contrib:0.161.0
    user: '${OBS_UID:-1000}:${OBS_GID:-1000}'
    read_only: true
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 256
    environment:
      HOME_TOKEN: ${HOME_TOKEN:?Set HOME_TOKEN}
      GOMEMLIMIT: 512MiB
    command: ['--config=/etc/otelcol/config.yaml']
    ports:
      - '${HOME_BIND:-127.0.0.1}:14318:4318'
      - '127.0.0.1:18888:8888'
    volumes:
      - ./gateway.yaml:/etc/otelcol/config.yaml:ro
      - ./secrets:/run/observability:ro
      - ${HOME_STATE:-./state/home}/collector:/var/lib/otelcol
    tmpfs: ['/tmp:size=16m,mode=1777']
    stop_grace_period: 45s

  victoria-metrics:
    <<: *common
    profiles: [home]
    image: victoriametrics/victoria-metrics:v1.153.0
    user: '${OBS_UID:-1000}:${OBS_GID:-1000}'
    mem_limit: 1g
    cpus: 2.0
    command:
      - -storageDataPath=/storage
      - -retentionPeriod=7d
      - -opentelemetry.usePrometheusNaming=true
      - -memory.allowedPercent=60
      - -promscrape.config=/etc/promscrape.yaml
    ports: ['127.0.0.1:18428:8428']
    volumes:
      - ${HOME_STATE:-./state/home}/metrics:/storage
      - ./promscrape.yaml:/etc/promscrape.yaml:ro
    stop_grace_period: 60s

  victoria-logs:
    <<: *common
    profiles: [home]
    image: victoriametrics/victoria-logs:v1.52.0
    user: '${OBS_UID:-1000}:${OBS_GID:-1000}'
    mem_limit: 1g
    cpus: 2.0
    command: ['-storageDataPath=/storage', '-retentionPeriod=7d', '-memory.allowedPercent=60']
    ports: ['127.0.0.1:19428:9428']
    volumes: ['${HOME_STATE:-./state/home}/logs:/storage']
    stop_grace_period: 60s

  victoria-traces:
    <<: *common
    profiles: [home]
    image: victoriametrics/victoria-traces:v0.12.0
    user: '${OBS_UID:-1000}:${OBS_GID:-1000}'
    mem_limit: 1g
    cpus: 2.0
    command: ['-storageDataPath=/storage', '-retentionPeriod=7d', '-memory.allowedPercent=60']
    ports: ['127.0.0.1:20428:10428']
    volumes: ['${HOME_STATE:-./state/home}/traces:/storage']
    stop_grace_period: 60s

  grafana:
    <<: *common
    profiles: [home]
    image: grafana/grafana:12.4.11
    user: '${OBS_UID:-1000}:${OBS_GID:-1000}'
    mem_limit: 512m
    cpus: 1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_PLUGINS_PREINSTALL_SYNC: victoriametrics-logs-datasource@0.27.1
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
    ports: ['${HOME_BIND:-127.0.0.1}:23000:3000']
    volumes:
      - ${HOME_STATE:-./state/home}/grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    stop_grace_period: 30s
