extensions:
  bearertokenauth:
    token: ${env:HOME_TOKEN}
  file_storage:
    directory: /var/lib/otelcol
    create_directory: true
    fsync: true
    # Per database file, not an aggregate directory quota. Keep compaction room.
    max_size: 536870912
    compaction:
      on_start: true
      on_rebound: true
      directory: /var/lib/otelcol
      rebound_needed_threshold_mib: 100
      rebound_trigger_threshold_mib: 10

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        max_request_body_size: 8388608
        auth:
          authenticator: bearertokenauth
        tls:
          cert_file: /run/observability/home.crt
          key_file: /run/observability/home.key

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  # Synchronous transformations only. No batch/tail-sampling processor may
  # acknowledge in memory before the persistent exporter queue takes ownership.
  transform/metric_resource:
    error_mode: propagate
    metric_statements:
      - context: resource
        statements:
          - keep_keys(attributes, ["service.name", "host.name", "deployment.environment.name", "deployment.environment"])

exporters:
  otlp_http/logs:
    logs_endpoint: http://victoria-logs:9428/insert/opentelemetry/v1/logs
    encoding: proto
    compression: gzip
    timeout: 10s
    headers:
      VL-Stream-Fields: service.name,host.name,deployment.environment.name
    retry_on_failure: &retry
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 0s
    sending_queue: &queue
      enabled: true
      storage: file_storage
      sizer: bytes
      queue_size: 67108864
      num_consumers: 2
      block_on_overflow: false
      batch:
        sizer: bytes
        min_size: 262144
        max_size: 1048576
        flush_timeout: 1s
  otlp_http/traces:
    traces_endpoint: http://victoria-traces:10428/insert/opentelemetry/v1/traces
    encoding: proto
    compression: gzip
    timeout: 10s
    retry_on_failure: *retry
    sending_queue: *queue
  otlp_http/metrics:
    metrics_endpoint: http://victoria-metrics:8428/opentelemetry/v1/metrics
    encoding: proto
    compression: gzip
    timeout: 10s
    retry_on_failure: *retry
    sending_queue: *queue

service:
  extensions: [bearertokenauth, file_storage]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_http/logs]
    traces:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp_http/traces]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/metric_resource]
      exporters: [otlp_http/metrics]
