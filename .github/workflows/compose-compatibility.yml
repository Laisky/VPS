name: YAML syntax

on:
  workflow_dispatch:
  pull_request:
    paths: ['**/*.yml', '**/*.yaml']
  push:
    branches: [master]
    paths: ['**/*.yml', '**/*.yaml']

permissions:
  contents: read

concurrency:
  group: vps-syntax-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check YAML syntax
        run: |
          python3 -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import yaml

          paths = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          checked = 0
          for name in paths:
              if not name.endswith((".yml", ".yaml")):
                  continue
              try:
                  list(yaml.compose_all(Path(name).read_text(encoding="utf-8")))
              except yaml.YAMLError as error:
                  # Never echo YAML payloads or credentials in diagnostics.
                  mark = getattr(error, "problem_mark", None)
                  line = mark.line + 1 if mark else "unknown"
                  raise SystemExit(f"Invalid YAML syntax: {name}, line {line}")
              checked += 1
          print(f"YAML syntax OK: {checked} files")
          PY
