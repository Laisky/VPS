# Optional b1-only overlay. Do not load until both managed files exist.
# See the go-ramjet MCP backup runbook in Laisky/configs.
services:
  go-ramjet:
    environment:
      PGPASSFILE: /run/secrets/ramjet-postgres-mcp.pgpass
    volumes:
      - type: bind
        source: /etc/ramjet-secrets/postgres-mcp.pgpass
        target: /run/secrets/ramjet-postgres-mcp.pgpass
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /etc/ramjet-secrets/postgres-mcp.age-passphrase
        target: /run/secrets/ramjet-postgres-mcp.age-passphrase
        read_only: true
        bind:
          create_host_path: false
