services:
  postgre:
    image: ppcelery/postgres:17.11-bookworm
    restart: unless-stopped
    stop_grace_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    env_file:
      - /opt/configs/env/dev/postgre.env
    volumes:
      - /var/lib/postgresql/data:/var/lib/postgresql/data
    ports:
      - 100.75.198.70:5432:5432

  # ARTEX's dedicated database; separate from the shared postgre service above.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - path: /opt/configs/env/dev/artex-postgres.env
        format: raw
    volumes:
      - artex-pgdata:/var/lib/postgresql/data
    networks:
      - artex
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  artex:
    image: artex-local:local
    build:
      context: ../ARTEX
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: /opt/configs/env/dev/artex.env
        format: raw
    environment:
      ARTEX_CONFIG: /app/config.json
      ARTEX_SKILL_DIR: /app/skills
    ports:
      - "100.75.198.70:8787:8787"
      - "100.75.198.70:8788:8788"
    volumes:
      - /opt/configs/artex/dev/config.json:/app/config.json:ro
      - /opt/configs/artex/dev/jwt.key:/app/jwt.key:ro
      - /opt/configs/artex/dev/data:/app/data
      - ../ARTEX/skills:/app/skills
    networks:
      - artex
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8787/api/health >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

networks:
  artex:

volumes:
  artex-pgdata:
    external: true
    name: artex-local-pgdata
